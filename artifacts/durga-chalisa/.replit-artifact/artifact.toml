kind = "web"
previewPath = "/"
title = "Durga Chalisa"
version = "1.0.0"
id = "artifacts/durga-chalisa"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25240

[services.development]
run = "pnpm --filter @workspace/durga-chalisa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/durga-chalisa", "run", "build" ]
serve = "static"
publicDir = "artifacts/durga-chalisa/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25240"
BASE_PATH = "/"
